[workspace]
name = "peak-head-tracking"
version = "1.0.0"
description = "Head tracking mod for PEAK using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
setup = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1"
setup-game = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1 -UseGameDlls"
restore = { cmd = "dotnet restore src/PeakHeadTracking/PeakHeadTracking.csproj", depends-on = ["setup"] }
build = { cmd = "dotnet build src/PeakHeadTracking/PeakHeadTracking.csproj -c Release", depends-on = ["restore"] }
# Checks that every member reference the build emits resolves against the
# assemblies it binds to at runtime. Stub/engine shape drift (a property
# declared as a field, or the reverse) compiles cleanly and only fails in
# game. Needs the game installed; skips and succeeds without it.
verify-refs = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/verify-assembly-refs.ps1 -GameId peak -BuildDir src/PeakHeadTracking/bin/Release", depends-on = ["build"] }
# The config differential test (tests/config_differential) holds the frozen legacy import to
# the newest published build's reader over every input the corpus generates.
test-unit = { cmd = "dotnet test tests/PeakHeadTracking.Tests/PeakHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName!~Differential", depends-on = ["build"] }
test-differential = { cmd = "dotnet test tests/PeakHeadTracking.Tests/PeakHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName~Differential", depends-on = ["build"] }
test = { depends-on = ["test-unit", "test-differential"] }
# Rewrites config/CameraUnlock.ini from the config table after a change to a row, a comment or
# a default, then the per_game of launcher-manifest.json's config descriptor. The render test
# compares the two on every `pixi run test`, so the committed file cannot drift from the code.
render-config = { cmd = "dotnet test tests/PeakHeadTracking.Tests/PeakHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName~RenderTests.CommittedFileIsTheRenderedDefaults && node cameraunlock-core/scripts/encode-seed.mjs", env = { CAMERAUNLOCK_RENDER_CONFIG = "write" }, depends-on = ["build"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test-unit"] }
uninstall = "scripts\\uninstall.cmd"
clean = "dotnet clean src/PeakHeadTracking/PeakHeadTracking.csproj"
# Bump vendored mod-loader copies to latest upstream within pinned range.
# Manual; commit the result. CI does not run this.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
# Checks the launcher contract against the built installer ZIP, the Nexus ZIP's contents included.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
